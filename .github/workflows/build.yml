name: APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Progetto
        run: |
          mkdir -p app/src/main/java/y app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          include ':app'
          E
          cat > build.gradle <<'E'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          E
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
            namespace 'y'
            compileSdk 35
            defaultConfig { applicationId 'it.patri.yoga'; minSdk 30; targetSdk 35; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-feature android:name="android.hardware.type.watch"/>
          <application android:label="Yoga" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <meta-data android:name="com.google.android.wearable.standalone" android:value="true"/>
          <activity android:name="y.M" android:exported="true">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity></application></manifest>
          E
          cat > app/src/main/java/y/M.java <<'E'
          package y;
          import android.app.Activity; import android.os.Bundle;
          import android.view.WindowManager; import android.webkit.WebView;
          public class M extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.setBackgroundColor(0xFF000000);
              w.loadUrl("file:///android_asset/index.html");
              setContentView(w);
            }
          }
          E
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: yoga-apk
          path: app/build/outputs/apk/debug/*.apk
