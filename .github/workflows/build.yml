name: Costruisci APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Genera il progetto Android
        run: |
          set -e
          mkdir -p app/src/main/java/it/patri/yoga app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "YogaWatch"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'it.patri.yoga'
            compileSdk 35
            defaultConfig {
              applicationId 'it.patri.yoga'
              minSdk 30
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.type.watch" />
            <application
                android:label="Yoga"
                android:icon="@drawable/ic_yoga"
                android:roundIcon="@drawable/ic_yoga"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <meta-data android:name="com.google.android.wearable.standalone" android:value="true" />
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/it/patri/yoga/MainActivity.java <<'EOF'
          package it.patri.yoga;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

